<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sitio SPA sin colisiones</title>
  <style>
    .spaui-body {
      margin: 0;
      font-family: sans-serif;
    }

    .spaui-header {
      background-color: #222;
      color: #fff;
      padding: 1em;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 9999;
    }

    .spaui-toggle {
      cursor: pointer;
      font-size: 1.2em;
    }

    .spaui-nav {
      display: none;
      background-color: #333;
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
    }

    .spaui-nav a {
      display: block;
      padding: 1em;
      color: #fff;
      text-decoration: none;
    }

    .spaui-nav a:hover {
      background-color: #444;
    }

    .spaui-show .spaui-nav {
      display: block;
    }

    .spaui-content {
      padding: 5rem 0 0;
    }
  </style>
</head>
<body class="spaui-body">
  <div class="spaui-header">
    <div class="spaui-toggle" onclick="spauiToggleMenu()">☰ Menú</div>
    <div class="spaui-nav" id="spaui-navbar">
      <a href="#" onclick="spauiLoadPage('01-pagina.html')">Página 1</a>
      <a href="#" onclick="spauiLoadPage('02-pagina.html')">Página 2</a>
      <a href="#" onclick="spauiLoadPage('03-pagina.html')">Página 3</a>
      <a href="#" onclick="spauiLoadPage('04-pagina.html')">Página 4</a>
      <a href="#" onclick="spauiLoadPage('05-pagina.html')">Página 5</a>
    </div>
  </div>

  <div class="spaui-content" id="spaui-content">
    <p>Bienvenido. Selecciona una página desde el menú.</p>
  </div>

  <script>
    function spauiToggleMenu() {
      document.body.classList.toggle('spaui-show');
    }

    function spauiLoadPage(url) {
      fetch(url)
        .then(response => response.text())
        .then(html => {
          document.getElementById('spaui-content').innerHTML = html;
          document.body.classList.remove('spaui-show');
          window.scrollTo(0, 0);
        })
        .catch(() => {
          document.getElementById('spaui-content').innerHTML = "<p>Error cargando el contenido.</p>";
        });
    }
  </script>
</body>
</html>
