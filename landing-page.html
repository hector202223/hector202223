<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Landing Page Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      line-height: 1.6;
      background: #f5f5f5;
      color: #333;
    }

    header {
      background: linear-gradient(to right, #007acc, #00c3ff);
      color: white;
      padding: 4rem 1rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    .btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      background: white;
      color: #007acc;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #f0f0f0;
    }

    section {
      padding: 3rem 1rem;
      max-width: 800px;
      margin: auto;
      text-align: center;
    }

    section h2 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    section p {
      font-size: 1.1rem;
      color: #666;
    }

    footer {
      background: #222;
      color: #ccc;
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Bienvenido a Mi Sitio</h1>
    <p>Una landing page simple para demostrar el visualizador</p>
    <a href="#info" class="btn">Saber más</a>
  </header>

  <section id="info">
    <h2>¿Qué es esto?</h2>
    <p>
      Esta es una landing page de prueba con HTML y CSS en un solo archivo.
      Ideal para probar tu visualizador sin cargar archivos externos.
    </p>
  </section>

  <footer>
    © 2025 Mi Sitio. Todos los derechos reservados.
  </footer>
</body>
</html>
