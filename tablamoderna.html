<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tabla con CSS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    table {
      width: 80%;
      border-collapse: collapse;
      margin: 0 auto;
      background-color: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 12px 15px;
      border: 1px solid #ccc;
      text-align: left;
    }

    th {
      background-color: #3498db;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    tr:hover {
      background-color: #e0f7fa;
    }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Tabla de ejemplo</h2>
  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Edad</th>
        <th>Ciudad</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Juan Pérez</td>
        <td>30</td>
        <td>Buenos Aires</td>
      </tr>
      <tr>
        <td>Lucía Gómez</td>
        <td>25</td>
        <td>Córdoba</td>
      </tr>
      <tr>
        <td>Martín Rodríguez</td>
        <td>40</td>
        <td>Rosario</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
